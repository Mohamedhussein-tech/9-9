<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حكايتنا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1218;--bg2:#4a2229;--ink:#fff1f1;--mut:#d9b7bb;--pink:#ff8fa3;--gold:#ffe3b0;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,system-ui,sans-serif;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);min-height:100vh;overflow-x:hidden}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0}
section{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 18px}
.card{width:100%;max-width:440px;background:var(--glass);border:1px solid var(--line);border-radius:32px;padding:22px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h2{text-align:center;font-weight:800;font-size:1.5rem}
.sub{text-align:center;color:var(--mut);margin-top:6px;font-size:.95rem}
.lbl{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);font-weight:600;font-size:.85rem;margin:14px 0}
.lbl:before,.lbl:after{content:"";height:1px;width:34px;background:var(--line)}
.hint{color:var(--mut);font-size:.8rem;opacity:.8}
/* intro */
#intro{cursor:pointer}
.env{position:relative;width:min(300px,78vw);height:180px;perspective:800px}
.env .body{position:absolute;inset:40px 0 0;background:linear-gradient(135deg,#a5545f,#d9808c);border-radius:20px;box-shadow:0 18px 40px #0008}
.env .paper{position:absolute;left:8%;right:8%;top:50px;height:120px;background:#fff;border-radius:14px;color:#8a3e4b;text-align:center;padding-top:30px;transition:transform .9s .35s cubic-bezier(.2,.8,.2,1);font-weight:800;z-index:1}
.env .paper small{display:block;font-weight:400;letter-spacing:.12em;font-size:.7rem;margin-top:4px}
.env .front{position:absolute;inset:40px 0 0;z-index:2;border-radius:20px;background:linear-gradient(135deg,#c26874 50%,#e9a0ab 50%)}
.env .flap{position:absolute;left:0;right:0;top:40px;height:95px;z-index:3;transform-origin:top;transition:transform .7s;background:linear-gradient(#f3a9b4,#d9808c);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:20px 20px 0 0}
.env .seal{position:absolute;z-index:4;left:50%;top:112px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd0d6,#e5808f);display:grid;place-items:center;font-size:1.4rem;transition:opacity .3s}
.open .flap{transform:rotateX(180deg);z-index:0}
.open .paper{transform:translateY(-70px)}
.open .seal{opacity:0}
.names{font-size:2.1rem;font-weight:800;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);font:600 .95rem Cairo,sans-serif;padding:10px 22px;border-radius:99px;cursor:pointer}
.btn.pink{background:linear-gradient(#ff9bab,#e97a8e);border:0;padding:14px 30px;box-shadow:0 8px 24px #ff8fa355}
#main{display:none}
/* counter */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.box{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px 4px;text-align:center}
.box b{display:block;font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.box span{color:var(--mut);font-size:.8rem}
/* music */
.music{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:12px 14px}
.play{flex:none;width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffb3be,#f0788d);color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 0 20px #ff8fa388}
.music div{flex:1}.music b{display:block}.music small{color:var(--mut)}
/* flip cards */
.promise{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px 8px;text-align:center;font-weight:600;font-size:.85rem;display:flex;flex-direction:column;gap:8px;align-items:center;transition:.3s}
.promise i{font-style:normal;font-size:1.6rem;color:var(--gold)}
.promise:hover,.promise:active{border-color:var(--pink);background:rgba(255,143,163,.15)}
.msg{height:120px;perspective:600px;cursor:pointer;border:0;background:none;font-family:inherit}
.msg .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.msg.f .in{transform:rotateY(180deg)}
.msg .a,.msg .b{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:600;font-size:.85rem;color:#fff}
.msg .a{background:var(--glass);border:1px solid var(--line);font-size:1.7rem;color:var(--gold)}
.msg .b{background:linear-gradient(#ff9bab,#e97a8e);transform:rotateY(180deg);line-height:1.6}
/* photos */
.photo{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:8px;cursor:pointer;text-align:center;font-size:.8rem;font-weight:600}
.photo .img{aspect-ratio:4/3;border-radius:18px;margin-bottom:8px;background:center/cover,linear-gradient(135deg,#6a3340,#33161e);display:grid;place-items:center;color:var(--mut);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* letter */
.letter{text-align:center}
.letter .heart{font-size:3rem;filter:drop-shadow(0 0 14px #ff8fa3)}
.letter p{line-height:2;color:#f6dcdf;margin:16px 0;font-size:.98rem}
.letter strong{color:var(--gold);font-size:1.15rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="petals"></canvas>

<section id="intro">
  <div class="env" id="env"><div class="paper"><span id="pn"></span><small>OUR ETERNAL LOVE STORY</small></div><div class="body"></div><div class="front"></div><div class="flap"></div><div class="seal">💗</div></div>
  <div class="names" id="names"></div>
  <button class="btn" id="openBtn">✉️ افتحي الجواب</button>
  <p class="hint">اضغطي على الظرف عشان تفتحي الحكاية</p>
</section>

<main id="main">
<section>
  <div class="card">
    <h2>حكايتنا 🤍</h2><p class="sub" id="tag"></p>
    <div class="lbl">منذ أن بدأت القصة</div>
    <div class="grid3" id="cnt"></div>
  </div>
  <div class="card">
    <div class="lbl" style="margin-top:0">🎵 موسيقى الذكرى</div>
    <div class="music"><button class="play" id="play">▶</button><div><b id="song"></b><small id="songSub">اضغطي لاختيار الأغنية</small></div></div>
    <input type="file" id="audioIn" accept="audio/*" hidden>
  </div>
  <p class="hint">اسحبي لتحت</p>
</section>

<section>
  <div class="card"><div class="lbl" style="margin-top:0">وعود من القلب</div><div class="grid3" id="promises"></div></div>
  <div class="card"><div class="lbl" style="margin-top:0">رسائل صغيرة</div><div class="grid3" id="msgs"></div></div>
  <p class="hint">اسحبي لتحت</p>
</section>

<section>
  <div class="card"><div class="lbl" style="margin-top:0">صور من الحكاية</div><p class="sub">كل صورة هنا جزء صغير من الحكاية، هادية وواضحة عشان الذكرى تبان أجمل.</p></div>
  <div class="grid2" id="photos" style="width:100%;max-width:440px"></div>
  <p class="hint">اضغطي على أي صورة لتغييرها</p>
  <input type="file" id="imgIn" accept="image/*" hidden>
</section>

<section>
  <div class="card letter">
    <div class="heart">💗</div>
    <h2 id="lt"></h2>
    <p id="lbody"></p>
    <strong id="lend"></strong><br><br>
    <button class="btn pink" id="again">✉️ افتحي الجواب من الأول</button>
  </div>
</section>
</main>

document.querySelectorAll('.photo').forEach(p=>p.onclick=()=>{cur=p;$('imgIn').click()});
$('imgIn').onchange=e=>{const f=e.target.files[0];if(!f||!cur)return;const u=URL.createObjectURL(f);const im=cur.querySelector('.img');im.style.backgroundImage=`url(${u})`;im.textContent='';e.target.value=''};

// counter
const labels=['سنة','شهر','يوم','ساعة','دقيقة','ثانية'];
$('cnt').innerHTML=labels.map(l=>`<div class="box"><b>0</b><span>${l}</span></div>`).join('');
const bs=[...document.querySelectorAll('#cnt b')];
function tick(){
  const s=new Date(CONFIG.start),n=new Date();
  let y=n.getFullYear()-s.getFullYear(),m=n.getMonth()-s.getMonth(),d=n.getDate()-s.getDate(),h=n.getHours()-s.getHours(),mi=n.getMinutes()-s.getMinutes(),se=n.getSeconds()-s.getSeconds();
  if(se<0){se+=60;mi--}if(mi<0){mi+=60;h--}if(h<0){h+=24;d--}
  if(d<0){d+=new Date(n.getFullYear(),n.getMonth(),0).getDate();m--}if(m<0){m+=12;y--}
  [y,m,d,h,mi,se].forEach((v,i)=>bs[i].textContent=Math.max(v,0));
}
tick();setInterval(tick,1000);

};
$('audioIn').onchange=e=>{const f=e.target.files[0];if(!f)return;au.src=URL.createObjectURL(f);$('song').textContent=f.name.replace(/\.[^.]+$/,'');$('songSub').textContent='الأغنية اللي بتوصفنا';au.play();$('play').textContent='❚❚'};

// intro
function openLetter(){
  $('env').classList.add('open');au.play().catch(()=>{});
  setTimeout(()=>{$('intro').style.display='none';$('main').style.display='block';window.scrollTo(0,0)},1300);
}
$('intro').onclick=openLetter;
$('again').onclick=()=>{$('main').style.display='none';$('intro').style.display='flex';$('env').classList.remove('open');window.scrollTo(0,0)};

// falling petals
const cv=$('petals'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<28;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:3+Math.random()*6,v:.3+Math.random()*.8,w:Math.random()*6});
(function loop(){cx.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{p.y+=p.v;p.w+=.02;p.x+=Math.sin(p.w)*.5;if(p.y>cv.height+10){p.y=-10;p.x=Math.random()*cv.width}
    cx.fillStyle='rgba(255,170,185,.35)';cx.beginPath();cx.ellipse(p.x,p.y,p.r,p.r*.65,p.w,0,7);cx.fill()});
  requestAnimationFrame(loop)})();
</script>
